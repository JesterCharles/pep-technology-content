spring.application.name=pickup

# data.sql runs after Hibernate has created the schema from the entities.
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# The three business exceptions are ErrorResponseExceptions: Spring answers
# them with problem details (application/problem+json) by itself.
spring.mvc.problemdetails.enabled=true

# Optional while working: watch the SQL.
# spring.jpa.show-sql=true
