spring.application.name=ops

# Where the partner service lives; the tests intercept this URL with
# MockRestServiceServer, so nothing is ever called over the network.
partner.base-url=https://partner.example/api

# Connect and read timeouts for every client built from the auto-configured
# RestClient.Builder: a hung partner must not hang us.
spring.http.clients.connect-timeout=2s
spring.http.clients.read-timeout=3s

