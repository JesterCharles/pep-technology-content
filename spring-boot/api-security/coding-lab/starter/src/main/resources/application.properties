spring.application.name=secure

# The JWT signing key. The default below is a disposable development value; a
# real deployment sets the JWT_SECRET environment variable and never commits
# the key (see the secrets topic). HS256 needs at least 32 bytes.
jwt.secret=${JWT_SECRET:dev-only-signing-key-0123456789abcdef0123456789abcdef}

# data.sql runs after Hibernate has created the schema from the entities (Task 7).
spring.jpa.defer-datasource-initialization=true
# Load data inside the service layer, never while the response is written.
spring.jpa.open-in-view=false
