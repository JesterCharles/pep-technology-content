openapi: 3.1.0
info:
  title: Workshop catalog API
  version: 1.0.0
  description: The operation Task 6 adds. Implement it exactly as described here.
paths:
  /workshops/{id}/availability:
    get:
      summary: Check whether a group can still book a workshop
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: groupSize
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The workshop exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          description: groupSize is missing or is not a number
        "404":
          description: No workshop has this id
components:
  schemas:
    Availability:
      type: object
      required:
        - workshopId
        - groupSize
        - bookable
      properties:
        workshopId:
          type: integer
        groupSize:
          type: integer
        bookable:
          type: boolean
          description: true when the workshop has at least groupSize seats
