spring.application.name=bookings

# data.sql runs after Hibernate has created the schema from the entities.
spring.jpa.defer-datasource-initialization=true

# Lazy loading fails honestly outside a transaction instead of being papered
# over by the open-in-view filter (Task 4 depends on this).
spring.jpa.open-in-view=false

# Optional while working: watch the SQL and spot the N+1 pattern of Task 3.
# spring.jpa.show-sql=true
