<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Duplicate credit</title>
</head>
<body>
  <main id="lesson" data-pep-complete="false">
    <h1>Duplicate credit</h1>
    <button id="success">Finish</button>
    <button id="wrong">Wrong</button>
    <button id="retry-right">Right</button>
    <button id="retry-wrong">Wrong again</button>
    <button id="sim">Credit</button>
    <button id="restart">Restart</button>
    <input id="command">
    <p id="terminal-log"></p>
    <p id="progress">0 of 1</p>
    <p id="feedback"></p>
  </main>
  <script>
    let count = 0;
    const lesson = document.querySelector('#lesson');
    const feedback = document.querySelector('#feedback');
    const complete = () => {
      lesson.dataset.pepComplete = 'true';
      document.querySelector('#progress').textContent = '1 of 1';
    };
    document.querySelector('#success').onclick = complete;
    document.querySelector('#retry-right').onclick = complete;
    document.querySelector('#retry-wrong').onclick = () => {
      complete();
      feedback.textContent = 'settled, not correct';
    };
    document.querySelector('#wrong').onclick = () => feedback.textContent = 'Try again';
    document.querySelector('#sim').onclick = () => {
      document.querySelector('#progress').textContent = `${++count} of 1`;
    };
    document.querySelector('#restart').onclick = () => {};
    document.querySelector('#command').onkeydown = event => {
      if (event.key === 'Enter') document.querySelector('#terminal-log').textContent = 'not available';
    };
  </script>
</body>
</html>
