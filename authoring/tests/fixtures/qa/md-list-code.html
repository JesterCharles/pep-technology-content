<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>List code Markdown fixture</title>
</head>
<body>
  <main>
    <h1>List code Markdown fixture</h1>
    <section data-pep-objectives>
      <h2>Objectives</h2>
      <ul><li>Keep block code inside an ordered list item.</li></ul>
    </section>
    <section data-pep-model>
      <h2>Pipeline model</h2>
      <ol>
        <li><pre>app.log</pre><span>10 lines</span></li>
        <li><pre>grep ERROR</pre><span>3 lines</span></li>
      </ol>
    </section>
    <section data-pep-recap>
      <h2>Recap</h2>
      <p>Recap after the list.</p>
    </section>
    <section data-interaction="pipeline" data-static-alt="Read the pipeline stages in order.">
      <button type="button">Step</button>
    </section>
  </main>
</body>
</html>
