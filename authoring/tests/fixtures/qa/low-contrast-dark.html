<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Low contrast dark</title>
  <style>
    :root { color-scheme: light dark; }
    body { background: #fff; color: #111; font: 16px system-ui; }
    button { border: 2px solid #555; }
    @media (prefers-color-scheme: dark) {
      body { background: #111; color: #333; }
      button { background: #111; border-color: #222; color: #333; }
    }
    button:focus-visible { outline: 3px solid orange; }
  </style>
</head>
<body>
  <main id="lesson" data-pep-complete="false">
    <h1>Low contrast dark</h1>
    <button id="success">Finish</button>
    <p aria-live="polite">Ready</p>
  </main>
  <script>
    document.querySelector('#success').onclick = () => {
      document.querySelector('#lesson').dataset.pepComplete = 'true';
    };
  </script>
</body>
</html>
