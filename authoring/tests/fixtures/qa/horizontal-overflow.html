<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Overflow</title>
  <style>
    body { margin: 0; }
    .wide { width: 500px; }
  </style>
</head>
<body>
  <main id="lesson" data-pep-complete="false">
    <h1>Horizontal overflow</h1>
    <div class="wide" data-essential>Essential content</div>
    <button id="success">Finish</button>
    <button id="wrong">Wrong</button>
    <button id="retry-right" hidden>Retry right</button>
    <button id="retry-wrong" hidden>Retry wrong</button>
    <p id="feedback"></p>
    <p id="progress">0 of 1</p>
  </main>
  <script>
    const lesson = document.querySelector('#lesson');
    const feedback = document.querySelector('#feedback');
    const complete = message => {
      lesson.dataset.pepComplete = 'true';
      feedback.textContent = message;
      document.querySelector('#progress').textContent = '1 of 1';
    };
    document.querySelector('#success').onclick = () => complete('Correct');
    document.querySelector('#wrong').onclick = () => {
      feedback.textContent = 'Try again';
      document.querySelector('#retry-right').hidden = false;
      document.querySelector('#retry-wrong').hidden = false;
    };
    document.querySelector('#retry-right').onclick = () => complete('Correct');
    document.querySelector('#retry-wrong').onclick = () => complete('settled, not correct');
  </script>
</body>
</html>
