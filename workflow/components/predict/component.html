          <fieldset id="predict" data-interaction="predict" data-confidence data-pep-predict>
            <legend>Your prediction</legend>
            <div class="opts">
              <label class="opt"><input type="radio" name="predict" id="p-whole" value="whole" aria-describedby="task-1"><span class="ot">Paste the whole error as it is</span></label>
              <label class="opt"><input type="radio" name="predict" id="p-redact" value="redact" aria-describedby="task-1"><span class="ot">Paste the error with the token replaced by a placeholder</span></label>
              <label class="opt"><input type="radio" name="predict" id="p-vague" value="vague" aria-describedby="task-1"><span class="ot">Describe the problem in one sentence, with no error text</span></label>
              <label class="opt"><input type="radio" name="predict" id="p-never" value="never" aria-describedby="task-1"><span class="ot">Never ask an assistant about errors</span></label>
            </div>
            <div class="row"><fieldset class="conf" id="conf0" data-pep-confidence aria-describedby="conf0-instr"><legend id="conf0-instr">How sure are you?</legend><label class="opt"><input type="radio" name="conf0" id="conf0-low" value="low"><span class="ot">Low</span></label><label class="opt"><input type="radio" name="conf0" id="conf0-medium" value="medium"><span class="ot">Medium</span></label><label class="opt"><input type="radio" name="conf0" id="conf0-high" value="high"><span class="ot">High</span></label></fieldset><button type="button" class="primary" id="predict-check" data-pep-predict-check aria-describedby="conf0-instr" disabled>Check prediction</button></div>
          </fieldset>
