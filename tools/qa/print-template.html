<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PEP print handout</title>
  <style>
    @page { size: Letter; margin: 0.7in; }
    :root { color: #172033; background: #fff; font: 11pt/1.55 system-ui, sans-serif; }
    body { margin: 0; }
    h1, h2, h3 { break-after: avoid; color: #10172a; font-family: Georgia, serif; line-height: 1.15; }
    h1 { font-size: 25pt; }
    h2 { border-bottom: 1px solid #737b8c; font-size: 17pt; padding-bottom: 0.12in; }
    h3 { font-size: 13pt; }
    pre, code { font-family: ui-monospace, monospace; }
    pre {
      background: #f2f4f8;
      border: 1px solid #737b8c;
      overflow-wrap: anywhere;
      padding: 0.12in;
      white-space: pre-wrap;
    }
    a { color: #154f94; text-decoration: underline; }
    li { margin: 0.04in 0; }
  </style>
</head>
<body>{{CONTENT}}</body>
</html>
