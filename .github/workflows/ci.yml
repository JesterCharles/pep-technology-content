name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Read pinned Playwright version
        id: playwright-version
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install dependencies, Playwright Chromium and Poppler
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Run repository gates
        run: |
          npm test
          authoring/tools/pep migrate-catalog --check
          npm run check

      - name: Upload QA diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-screenshots-and-traces
          path: |
            build/qa/**/*.png
            build/qa/**/*.zip
          if-no-files-found: ignore
          retention-days: 7
