<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trail Guides dashboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <h1>Trail Guides dashboard</h1>
      <p id="status" role="status" aria-live="polite">Pick a trail or refresh the dashboard.</p>
    </header>
    <main class="site-main">
      <section aria-label="Find a trail">
        <label for="search">Filter trails by name</label>
        <input id="search" type="search" autocomplete="off">
      </section>
      <section aria-label="Trails">
        <ul id="trail-list"></ul>
      </section>
      <section aria-label="Conditions">
        <button id="refresh" type="button">Refresh featured conditions</button>
      </section>
    </main>
    <footer class="site-footer">
      <p>Trail Guides is a practice page for this lab.</p>
    </footer>
  </div>
  <script src="data.js"></script>
  <script src="fake-api.js"></script>
  <script src="app.js"></script>
</body>
</html>
